services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: athleta
      POSTGRES_PASSWORD: athleta_local_only
      POSTGRES_DB: athleta
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athleta -d athleta"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_local_only
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin_local_only; do sleep 1; done; mc mb --ignore-existing local/athleta-files; mc anonymous set none local/athleta-files"
volumes:
  postgres_data:
  minio_data:
